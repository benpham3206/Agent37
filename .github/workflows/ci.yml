name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: bridge tests + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The combat CI benchmark reads a pinned historical commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install Python test dependencies
        run: if [ -f ml/requirements.txt ]; then python -m pip install -r ml/requirements.txt; elif [ -d ml ]; then python -m pip install pytest; else echo 'SKIP Python dependencies; ml does not exist.'; fi
      - name: Verify everything (no game server)
        run: npm run verify
